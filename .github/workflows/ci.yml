name: VisionCart AI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint & Pytest (Mock YOLO)
    runs-on: ubuntu-latest

    env:
      DETECTOR_MODE: mock
      SECRET_KEY: ci-test-secret-key-32-chars-long!!
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      SYNC_DATABASE_URL: sqlite:///./test_ci.db
      SEED_ADMIN_EMAIL: admin@visioncart.local
      SEED_ADMIN_PASSWORD: Admin@1234
      SEED_CASHIER_EMAIL: cashier@visioncart.local
      SEED_CASHIER_PASSWORD: Cashier@1234

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Linter (Ruff)
        run: |
          ruff check backend/app

      - name: Apply Alembic Migrations & Seed DB
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          PYTHONPATH=backend python backend/app/seed.py

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=backend pytest backend/tests -v --tb=short

  frontend-checks:
    name: Frontend Vitest & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Vitest Smoke Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build

  docker-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: visioncart-backend:ci

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: visioncart-frontend:ci

