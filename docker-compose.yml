services:
  postgres:
    image: postgres:16-alpine
    container_name: visioncart-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visioncart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visioncart_secret}
      POSTGRES_DB: ${POSTGRES_DB:-visioncart_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visioncart} -d ${POSTGRES_DB:-visioncart_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visioncart-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-visioncart}:${POSTGRES_PASSWORD:-visioncart_secret}@postgres:5432/${POSTGRES_DB:-visioncart_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-visioncart}:${POSTGRES_PASSWORD:-visioncart_secret}@postgres:5432/${POSTGRES_DB:-visioncart_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-visioncart_super_secret_jwt_key_change_in_production_99881122}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - DETECTOR_MODE=${DETECTOR_MODE:-yolo}
      - MODEL_PATH=${MODEL_PATH:-ml/weights/yolov8n.pt}
      - CONFIDENCE_THRESHOLD=0.45
      - DETECTOR_DEVICE=cpu
      - SMOOTHING_N_FRAMES=3
      - SMOOTHING_M_FRAMES=5
      - SEED_ADMIN_EMAIL=admin@visioncart.local
      - SEED_ADMIN_PASSWORD=Admin@1234
      - SEED_CASHIER_EMAIL=cashier@visioncart.local
      - SEED_CASHIER_PASSWORD=Cashier@1234
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost,http://127.0.0.1:3000,http://127.0.0.1:5173
      - DETECTION_RATE_LIMIT=300
    ports:
      - "8000:8000"
    volumes:
      - ./ml/weights:/app/ml/weights
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visioncart-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

